<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2150 490" width="100%" height="100%">
  <defs>
    <!-- Escudo oficial de España exacto -->
    <g id="escudo-exacto">
      <!-- Corona Real -->
      <!-- Cruz y orbe superior -->
      <circle cx="82" cy="18" r="4.5" fill="#E6A100" stroke="#8C5E00" stroke-width="1.2"/>
      <path d="M82 14 L82 22 M78 18 L86 18" stroke="#8C5E00" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Bonete rojo -->
      <path d="M36 50 C40 24 64 16 82 16 C100 16 124 24 128 50 Z" fill="#D31A24" stroke="#8C5E00" stroke-width="2"/>
      <!-- Diademas / Perlas -->
      <path d="M36 50 Q82 28 128 50" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <path d="M54 50 Q82 22 110 50" stroke="#E6A100" stroke-width="2.5" fill="none"/>
      <path d="M82 16 L82 50" stroke="#E6A100" stroke-width="3"/>
      <circle cx="82" cy="35" r="3.2" fill="#FFFFFF"/>
      <circle cx="66" cy="39" r="3" fill="#18679B"/>
      <circle cx="98" cy="39" r="3" fill="#18679B"/>

      <!-- Cintillo de la corona -->
      <rect x="30" y="48" width="104" height="16" rx="2" fill="#E6A100" stroke="#8C5E00" stroke-width="1.8"/>
      <circle cx="42" cy="56" r="3.2" fill="#18679B"/>
      <circle cx="55" cy="56" r="3.2" fill="#D31A24"/>
      <circle cx="68" cy="56" r="3.2" fill="#1B8738"/>
      <circle cx="82" cy="56" r="3.2" fill="#D31A24"/>
      <circle cx="96" cy="56" r="3.2" fill="#1B8738"/>
      <circle cx="109" cy="56" r="3.2" fill="#D31A24"/>
      <circle cx="122" cy="56" r="3.2" fill="#18679B"/>

      <!-- Columna Izquierda: Corona Imperial + Capitel + Fuste + PLVS -->
      <g transform="translate(0, 68)">
        <path d="M8 6 L26 6 L24 -4 L17 -1 L10 -4 Z" fill="#E6A100" stroke="#8C5E00" stroke-width="1.2"/>
        <rect x="12" y="6" width="10" height="6" fill="#A8A8A8"/>
        <rect x="12" y="12" width="10" height="124" fill="#D4D4D4" stroke="#707070" stroke-width="1.5"/>
        <rect x="8" y="136" width="18" height="10" fill="#A8A8A8" stroke="#606060" stroke-width="1.5"/>
        <!-- Olas -->
        <path d="M3 146 Q17 140 31 146" stroke="#18679B" stroke-width="3" fill="none"/>
        <path d="M3 151 Q17 145 31 151" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <!-- Cinta PLVS -->
        <path d="M-2 62 C15 54 22 76 36 68 L36 86 C22 94 15 72 -2 80 Z" fill="#D31A24" stroke="#850B12" stroke-width="1.5"/>
        <text x="17" y="77" fill="#FFFFFF" font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">PLVS</text>
      </g>

      <!-- Columna Derecha: Corona Real + Capitel + Fuste + VLTRA -->
      <g transform="translate(130, 68)">
        <path d="M8 6 L26 6 L24 -4 L17 -1 L10 -4 Z" fill="#E6A100" stroke="#8C5E00" stroke-width="1.2"/>
        <rect x="12" y="6" width="10" height="6" fill="#A8A8A8"/>
        <rect x="12" y="12" width="10" height="124" fill="#D4D4D4" stroke="#707070" stroke-width="1.5"/>
        <rect x="8" y="136" width="18" height="10" fill="#A8A8A8" stroke="#606060" stroke-width="1.5"/>
        <!-- Olas -->
        <path d="M3 146 Q17 140 31 146" stroke="#18679B" stroke-width="3" fill="none"/>
        <path d="M3 151 Q17 145 31 151" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <!-- Cinta VLTRA -->
        <path d="M-2 62 C15 54 22 76 36 68 L36 86 C22 94 15 72 -2 80 Z" fill="#D31A24" stroke="#850B12" stroke-width="1.5"/>
        <text x="17" y="77" fill="#FFFFFF" font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="900" text-anchor="middle">VLTRA</text>
      </g>

      <!-- Escudo Central -->
      <g transform="translate(39, 68)">
        <path d="M0 0 H86 V72 C86 102 43 120 43 120 C43 120 0 102 0 72 Z" fill="#FFFFFF" stroke="#E6A100" stroke-width="3.5"/>
        
        <!-- Cuartel 1: Castilla -->
        <path d="M0 0 H43 V58 H0 Z" fill="#D31A24"/>
        <g transform="translate(9, 12)">
          <rect x="3" y="14" width="18" height="20" fill="#FFC900" stroke="#8C5E00" stroke-width="1"/>
          <rect x="1" y="8" width="6" height="8" fill="#FFC900" stroke="#8C5E00" stroke-width="0.8"/>
          <rect x="9" y="4" width="6" height="12" fill="#FFC900" stroke="#8C5E00" stroke-width="0.8"/>
          <rect x="17" y="8" width="6" height="8" fill="#FFC900" stroke="#8C5E00" stroke-width="0.8"/>
          <path d="M9 22 H15 V34 H9 Z" fill="#18679B"/>
        </g>

        <!-- Cuartel 2: León -->
        <path d="M43 0 H86 V58 H43 Z" fill="#FFFFFF"/>
        <g transform="translate(52, 11)">
          <path d="M8 33 C6 25 10 19 14 16 C17 12 13 9 16 6 C19 8 20 11 20 13 C23 17 24 23 21 28 C24 31 22 34 21 35 L15 35 C14 32 13 33 10 35 Z" fill="#C23685" stroke="#7A184F" stroke-width="0.8"/>
          <path d="M16 6 L18 2 L21 5 Z" fill="#FFC900"/>
        </g>

        <!-- Cuartel 3: Aragón -->
        <path d="M0 58 H43 V98 C28 90 15 78 0 66 Z" fill="#FFC900"/>
        <line x1="9" y1="58" x2="9" y2="80" stroke="#D31A24" stroke-width="4.5"/>
        <line x1="18" y1="58" x2="18" y2="90" stroke="#D31A24" stroke-width="4.5"/>
        <line x1="27" y1="58" x2="27" y2="96" stroke="#D31A24" stroke-width="4.5"/>
        <line x1="36" y1="58" x2="36" y2="99" stroke="#D31A24" stroke-width="4.5"/>

        <!-- Cuartel 4: Navarra -->
        <path d="M43 58 H86 V66 C71 78 58 90 43 98 Z" fill="#D31A24"/>
        <g transform="translate(48, 64)" stroke="#FFC900" stroke-width="2.2" fill="none">
          <rect x="3" y="3" width="24" height="24" rx="3"/>
          <line x1="3" y1="3" x2="27" y2="27"/>
          <line x1="27" y1="3" x2="3" y2="27"/>
          <line x1="15" y1="3" x2="15" y2="27"/>
          <line x1="3" y1="15" x2="27" y2="15"/>
          <circle cx="15" cy="15" r="3.5" fill="#1B8738" stroke="#FFC900" stroke-width="1.5"/>
        </g>

        <!-- Granada -->
        <path d="M33 95 Q43 84 53 95 Q43 114 33 95 Z" fill="#FFFFFF" stroke="#E6A100" stroke-width="1.5"/>
        <circle cx="43" cy="100" r="3.5" fill="#D31A24"/>

        <!-- Escusón Borbón -->
        <ellipse cx="43" cy="58" rx="9" ry="12" fill="#18679B" stroke="#D31A24" stroke-width="2"/>
        <circle cx="43" cy="52" r="1.8" fill="#FFC900"/>
        <circle cx="39" cy="60" r="1.8" fill="#FFC900"/>
        <circle cx="47" cy="60" r="1.8" fill="#FFC900"/>
      </g>
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- 1. MINISTERIO DE CIENCIA, INNOVACIÓN Y UNIVERSIDADES (Groc #FFCD00) -->
  <!-- ========================================== -->
  <g id="box-1-miciu">
    <!-- Fons groc oficial -->
    <rect x="30" y="45" width="1025" height="400" fill="#FFCD00" />
    
    <!-- Escut d'Espanya -->
    <g transform="translate(85, 120) scale(1.45)">
      <use href="#escudo-exacto" />
    </g>

    <!-- Text ministerial -->
    <text x="420" y="212" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="0.5">
      MINISTERIO
    </text>
    <text x="420" y="282" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="0.5">
      DE CIENCIA, INNOVACIÓN
    </text>
    <text x="420" y="352" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="0.5">
      Y UNIVERSIDADES
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 2. UNIÓN EUROPEA - FSE (Bandera blava + text a sota) -->
  <!-- ========================================== -->
  <g id="box-2-ue" transform="translate(1090, 45)">
    <!-- Bandera blava europea -->
    <rect x="0" y="0" width="370" height="248" fill="#003399" />
    
    <!-- 12 estrelles grogues centrades a (185, 124) amb radi R=75 -->
    <g fill="#FFCC00">
      <!-- 12:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" />
      <!-- 1:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(30, 185, 124)" />
      <!-- 2:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(60, 185, 124)" />
      <!-- 3:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(90, 185, 124)" />
      <!-- 4:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(120, 185, 124)" />
      <!-- 5:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(150, 185, 124)" />
      <!-- 6:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(180, 185, 124)" />
      <!-- 7:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(210, 185, 124)" />
      <!-- 8:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(240, 185, 124)" />
      <!-- 9:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(270, 185, 124)" />
      <!-- 10:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(300, 185, 124)" />
      <!-- 11:00 -->
      <polygon points="185,49 189.2,62 202.8,62 191.8,70 196,83 185,75 174,83 178.2,70 167.2,62 180.8,62" transform="rotate(330, 185, 124)" />
    </g>

    <!-- Text oficial FSE sota la bandera -->
    <text x="0" y="295" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.3">
      UNIÓN EUROPEA
    </text>
    <text x="0" y="340" fill="#000000" font-family="'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="500" letter-spacing="-0.3">
      Fondo Social Europeo
    </text>
    <text x="0" y="385" fill="#000000" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="-0.3">
      El FSE invierte en tu futuro
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 3. AGENCIA ESTATAL DE INVESTIGACIÓN (Fons blau grisós #DCE5F2) -->
  <!-- ========================================== -->
  <g id="box-3-aei" transform="translate(1520, 45)">
    <!-- Fons continu de la caixa AEI -->
    <rect x="0" y="0" width="600" height="400" fill="#DCE5F2" />
    
    <!-- Símbol cal·ligràfic 'eI' de l'AEI en blau marí #003366 -->
    <g transform="translate(30, 45) scale(1.5)" fill="#003366">
      <path d="M85 0 C78 14 65 38 45 62 C31 80 15 96 1 100 C13 98 30 88 45 78 C57 68 69 55 78 40 L78 180 C78 194 82 204 86 204 C91 204 98 188 104 165 L104 38 C108 26 110 14 112 2 L85 0 Z" />
      <path d="M55 73 C38 90 21 108 2 122 C17 115 38 98 55 73 Z" />
      <path d="M78 180 C62 170 41 150 22 130 C14 122 7 114 1 105 C5 114 14 127 24 138 C41 156 62 173 78 180 Z" />
    </g>

    <!-- Text AEI -->
    <text x="260" y="160" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="0.5">
      AGENCIA
    </text>
    <text x="260" y="230" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="0.5">
      ESTATAL DE
    </text>
    <text x="260" y="300" fill="#000000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="900" letter-spacing="0.2">
      INVESTIGACIÓN
    </text>
  </g>
</svg>
